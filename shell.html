<title>Asiana Gold Chainworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================
   ASIANA GOLD — redesign v3, gold-led
   ========================================================== */
:root{
  --g50:#FDF9EF; --g100:#F8EFD8; --g200:#EFDDB2; --g300:#E3C982;
  --g400:#D3AE55; --g500:#BE9330; --g600:#9E7621; --g700:#7B5A16;
  --espresso:#2A2013; --espresso-2:#1A1409;
  --paper:#FFFFFF; --tint:#F4F1E8; --plate:#FFFFFF; --card:#FFFFFF;
  --ink:#251C10; --ink-2:#6B5C45; --ink-3:#9A8B72;
  --rule:#D8CFBB; --rule-2:#EAE3D2;
  --onDark:#F6EEDC; --onDark-2:#C8B694;
  --metal:linear-gradient(105deg,#A8823A 0%,#EFDCA6 20%,#C99C36 44%,#8C6A1E 62%,#EDD99E 84%,#C7A44C 100%);
  --shadow-s:0 1px 2px rgba(60,44,16,.06), 0 6px 18px -12px rgba(60,44,16,.28);
  --shadow-m:0 2px 6px rgba(60,44,16,.08), 0 18px 40px -24px rgba(60,44,16,.42);
  --shadow-l:0 8px 20px rgba(60,44,16,.12), 0 40px 80px -40px rgba(60,44,16,.55);
  --focus:#8C6A1E; --maxw:1240px;
  /* the mark's own gold ramp — pale at the left, bronze at the right */
  --lg1:#E2CA8B; --lg2:#CDAB57; --lg3:#BC9433; --lg4:#A37D26; --lg5:#89671F; --lg6:#6F5417;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171208; --tint:#1D1710; --card:#211A0F; --plate:#EFE9DC;
    --ink:#F3EADA; --ink-2:#BCAB8E; --ink-3:#8E7F66;
    --rule:#3A2F1D; --rule-2:#2B2214; --g50:#221B0F; --g100:#2C2313;
    --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -12px rgba(0,0,0,.9);
    --shadow-m:0 2px 6px rgba(0,0,0,.5), 0 18px 44px -24px rgba(0,0,0,.95);
    --shadow-l:0 8px 22px rgba(0,0,0,.6), 0 44px 88px -40px rgba(0,0,0,1);
    --focus:#E3C982;
    --lg1:#F5E8C2; --lg2:#E6CE8B; --lg3:#D8B75F; --lg4:#C7A247; --lg5:#B48C33; --lg6:#A17A29;
  }
}
:root[data-theme="dark"]{
  --paper:#171208; --tint:#1D1710; --card:#211A0F; --plate:#EFE9DC;
  --ink:#F3EADA; --ink-2:#BCAB8E; --ink-3:#8E7F66;
  --rule:#3A2F1D; --rule-2:#2B2214; --g50:#221B0F; --g100:#2C2313;
  --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -12px rgba(0,0,0,.9);
  --shadow-m:0 2px 6px rgba(0,0,0,.5), 0 18px 44px -24px rgba(0,0,0,.95);
  --shadow-l:0 8px 22px rgba(0,0,0,.6), 0 44px 88px -40px rgba(0,0,0,1);
  --focus:#E3C982;
  --lg1:#F5E8C2; --lg2:#E6CE8B; --lg3:#D8B75F; --lg4:#C7A247; --lg5:#B48C33; --lg6:#A17A29;
}

*{box-sizing:border-box}
:root{font-size:17px}
/* type roles: Cormorant Garamond displays, EB Garamond reads, Plex Mono counts */
body{background:var(--paper);color:var(--ink);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.7;
  -webkit-font-smoothing:antialiased}
.sans{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body.locked{overflow:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.14}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:0;line-height:1.08}
h1{font-size:clamp(2.5rem,5.4vw,4.1rem)}
h2{font-size:clamp(1.95rem,3.6vw,2.85rem)}
h1 em,h2 em{font-style:italic;font-weight:400}
h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;font-weight:600;letter-spacing:.005em}
p{margin:0}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.stagger > *{animation:none}
.stagger > *:nth-child(1){animation-delay:.04s}
.stagger > *:nth-child(2){animation-delay:.10s}
.stagger > *:nth-child(3){animation-delay:.16s}
.stagger > *:nth-child(4){animation-delay:.22s}
.stagger > *:nth-child(5){animation-delay:.28s}
.stagger > *:nth-child(6){animation-delay:.34s}
.stagger > *:nth-child(7){animation-delay:.40s}
.stagger > *:nth-child(8){animation-delay:.46s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{display:block;font-family:"EB Garamond",Georgia,serif;font-size:1rem;
  font-style:italic;color:var(--g700);margin-bottom:2px}
.eyebrow.on-dark{color:var(--g300)}
.lede{color:var(--ink-2);font-size:1.05rem;font-style:italic;max-width:60ch}
.ph{display:inline;font-family:"EB Garamond",Georgia,serif;font-size:.94rem;font-style:italic;
  color:#9A4A28;border-bottom:1px dashed #C08268;margin-left:7px;white-space:nowrap}

/* ornament divider — the brand's own chain-link motif */
.orn{display:none}
.orn::before,.orn::after{content:"";height:1px;flex:1;max-width:220px;
  background:linear-gradient(90deg,transparent,var(--g300))}
.orn::after{background:linear-gradient(90deg,var(--g300),transparent)}

.logo{display:block;height:auto}
/* on an espresso ground the ramp has to sit brighter to stay legible */
.logo.on-dark{--lg1:#FBF3DC;--lg2:#F0DDA9;--lg3:#E3C87F;--lg4:#D5B463;--lg5:#C3A04C;--lg6:#B08C3C}

/* ---------- utility bar ---------- */
.util{background:var(--espresso-2);color:var(--onDark-2);font-family:"EB Garamond",Georgia,serif;
  font-size:.96rem;font-weight:400}
.util .wrap{display:flex;align-items:center;gap:18px;height:38px;overflow-x:auto;scrollbar-width:none}
.util .wrap::-webkit-scrollbar{display:none}
.util a{white-space:nowrap}
.util a:hover{color:var(--g300)}
.util .sep{width:1px;height:14px;background:rgba(255,255,255,.14);flex-shrink:0}
.util .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:5px;overflow:hidden}
.lang button{padding:3px 9px;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:600;color:var(--onDark-2)}
.lang button[aria-pressed="true"]{background:var(--g400);color:#241B0A}
.theme-btn{width:28px;height:24px;border:1px solid rgba(255,255,255,.22);border-radius:5px;
  display:grid;place-items:center;color:var(--onDark-2)}
.theme-btn:hover{color:var(--g300);border-color:var(--g400)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1px solid var(--rule);box-shadow:var(--shadow-s)}
.topbar{display:flex;align-items:center;gap:20px;height:100px}
.topbar .logo{width:240px;flex-shrink:0}
nav.main{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.main > button,.navitem > button{padding:9px 12px;border-radius:0;
  font-family:"EB Garamond",Georgia,serif;font-size:1.06rem;font-weight:500;
  color:var(--ink-2);white-space:nowrap;transition:color .16s;display:inline-flex;align-items:center;gap:6px}
nav.main > button:hover,.navitem > button:hover{color:var(--g700)}
nav.main > button[aria-current="page"]{color:var(--ink);background:transparent;font-weight:600;
  box-shadow:inset 0 -1px 0 var(--g600)}
.navitem{position:relative}
.navitem > button::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;
  border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.mega{position:absolute;top:100%;right:0;width:min(640px,88vw);background:var(--paper);
  border:1px solid var(--rule);border-radius:0;box-shadow:0 18px 40px -28px rgba(60,44,16,.5);padding:16px;
  display:none;grid-template-columns:1fr 1fr;gap:2px;z-index:70}
.navitem:hover .mega,.navitem:focus-within .mega{display:grid;animation:fadein .16s}
.mega button{display:flex;gap:12px;align-items:center;padding:9px;border-radius:0;text-align:left;width:100%}
.mega button:hover{background:var(--g50)}
.mega .mega-all{grid-column:1/-1;justify-content:center;border-top:1px solid var(--rule);
  margin-top:6px;padding-top:12px;font-family:"EB Garamond",Georgia,serif;font-style:italic;color:var(--g700)}
.mega .th{width:46px;height:46px;border-radius:0;background:var(--plate);border:1px solid var(--rule-2);flex-shrink:0;overflow:hidden}
.mega .th img{width:100%;height:100%;object-fit:contain;padding:3px}
.mega b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.1rem;font-weight:600}
.mega i{font-style:italic;font-size:.86rem;color:var(--ink-3)}
.hdr-cta{display:flex;align-items:center;gap:9px;flex-shrink:0}
.burger{display:none}
@media(max-width:1120px){
  nav.main{display:none}
  .burger{display:inline-flex;margin-left:auto;padding:9px 12px;border:1px solid var(--rule);
    border-radius:8px;font-size:.86rem;font-weight:600;gap:8px;align-items:center}
}
.drawer-nav{display:none;border-top:1px solid var(--rule);background:var(--card);padding:10px 0 16px}
.drawer-nav.open{display:block}
.drawer-nav button{display:block;width:100%;text-align:left;padding:11px 20px;font-size:.95rem;
  font-weight:500;border-bottom:1px solid var(--rule-2)}
.drawer-nav button:hover{background:var(--g50);color:var(--g700)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;
  border-radius:2px;font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:1.02rem;
  border:1px solid transparent;transition:background .18s,color .18s,border-color .18s;white-space:nowrap}
.btn-gold{background:var(--g700);color:#FDFBF5}
.btn-gold:hover{background:var(--g800,#63490F)}
.btn-dark{background:var(--espresso);color:var(--onDark);border-radius:2px}
.btn-line{border-color:var(--rule);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--g600);color:var(--g700)}
.btn-sm{padding:9px 18px;font-size:.94rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- hero carousel ---------- */
.hero{position:relative;background:var(--metal);overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 90% at 78% 20%,rgba(255,250,232,.55),transparent 60%)}
.slides{position:relative;display:grid}
.slide{grid-area:1/1;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .55s ease, visibility 0s linear .55s}
.slide.on{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .55s ease, visibility 0s linear 0s}
.slide-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:clamp(24px,4vw,58px);align-items:center;
  padding-block:clamp(44px,5.5vw,80px) clamp(84px,9vw,120px)}
@media(max-width:900px){.slide-grid{grid-template-columns:1fr;padding-bottom:104px}}
.hero-copy h1{margin:16px 0 16px;color:#241A0B}
.hero-copy .lede{color:#4A3922;max-width:52ch}
.hero .eyebrow{color:#6B5217}
.hero .eyebrow::before{background:#6B5217}
.hero .cta{display:flex;gap:11px;margin-top:28px;flex-wrap:wrap}
.hero .btn-gold{background:#F4EEDF;color:#22190C;border-color:#F4EEDF}
.hero .btn-gold:hover{background:var(--g300);border-color:var(--g300)}
.hero .btn-line{border-color:rgba(50,36,14,.42);color:#3A2B14}
.hero .btn-line:hover{background:rgba(255,255,255,.3)}
.hero-art{position:relative}
.hero-plate{background:var(--plate);border-radius:14px;padding:26px;aspect-ratio:1/1;display:grid;
  place-items:center;box-shadow:0 30px 60px -30px rgba(50,34,8,.6);border:1px solid rgba(255,255,255,.6);overflow:hidden}
.hero-plate img{width:100%;height:100%;object-fit:contain}
.hero-badge{position:absolute;left:-14px;bottom:26px;background:var(--espresso);color:var(--g200);
  border-radius:10px;padding:11px 15px;box-shadow:var(--shadow-l)}
.hero-badge b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1rem;letter-spacing:.04em;color:var(--g300)}
.hero-badge span{font-size:.72rem;color:var(--onDark-2)}
.hero-nav{position:absolute;left:0;right:0;bottom:52px;z-index:6;pointer-events:none}
.hero-nav .wrap{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:8px;pointer-events:auto}
.dots button{width:30px;height:4px;border-radius:99px;background:rgba(45,32,12,.28);transition:background .2s,width .2s}
.dots button[aria-current="true"]{background:var(--espresso);width:52px}
.arrows{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.arrows button{width:38px;height:38px;border-radius:99px;border:1px solid rgba(45,32,12,.3);
  display:grid;place-items:center;color:#3A2B14;background:rgba(255,255,255,.35);transition:all .16s}
.arrows button:hover{background:var(--espresso);color:var(--g200);border-color:transparent}

/* ---------- stat rail ---------- */
.rail{position:relative;margin-top:-56px;z-index:5}
.rail .inner{background:var(--card);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow-l);display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}
@media(max-width:860px){.rail .inner{grid-template-columns:repeat(2,1fr)}}
.rail div{padding:20px 18px;border-right:1px solid var(--rule-2);text-align:center}
.rail div:last-child{border-right:0}
.rail b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2rem;color:var(--g600);line-height:1.1}
.rail span{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:.8rem;
  letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin-top:5px}

/* ---------- sections ---------- */
section{padding-block:clamp(48px,6.5vw,88px)}
.band-tint{background:var(--tint);border-block:1px solid var(--rule-2)}
.band-dark{background:var(--espresso);color:var(--onDark)}
.band-dark h2,.band-dark h3{color:var(--onDark)}
.band-dark .lede{color:var(--onDark-2)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;margin-bottom:30px;flex-wrap:wrap}
.sec-head h2{margin-top:10px}
.sec-head p{max-width:56ch;color:var(--ink-2);margin-top:8px}
.center{text-align:center;flex-direction:column;align-items:center}
.center p{margin-inline:auto}

/* ---------- tiles / cards ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.cats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
.cat-tile{position:relative;background:transparent;border:0;text-align:left;
  display:flex;flex-direction:column;padding:0}
.cat-tile .pic{background:var(--plate);aspect-ratio:4/3;display:grid;place-items:center;padding:14px;
  border:1px solid var(--rule-2);overflow:hidden}
.cat-tile:hover .pic{border-color:var(--g500)}
.cat-tile .pic img{width:100%;height:100%;object-fit:contain}
.cat-tile .body{padding:13px 0 0;display:flex;flex-direction:column;gap:2px;flex:1}
.cat-tile .body b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;font-weight:600;line-height:1.2}
.cat-tile .body i{font-style:italic;font-size:.92rem;color:var(--ink-3)}
.cat-tile .body u{text-decoration:none;margin-top:auto;padding-top:7px;
  font-family:"EB Garamond",Georgia,serif;font-size:.94rem;font-style:italic;color:var(--g700)}
.cat-tile:hover .body u{text-decoration:underline;text-underline-offset:3px}
.ribbon{display:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:16px}
.card{background:transparent;border:0;text-align:left;display:flex;flex-direction:column;position:relative}
.card .pic{background:var(--plate);aspect-ratio:1/1;display:grid;place-items:center;padding:16px;
  border:1px solid var(--rule-2);position:relative;overflow:hidden}
.card:hover .pic{border-color:var(--g500)}
.card .pic img{width:100%;height:100%;object-fit:contain}
.quick{position:absolute;left:0;right:0;bottom:0;opacity:0;background:rgba(23,18,8,.88);
  color:#F4EEDF;font-size:.94rem;padding:9px 0;text-align:center;transition:opacity .18s;
  white-space:nowrap;pointer-events:auto;font-style:italic}
.card:hover .quick{opacity:1}
.card .m{padding:11px 0 0;display:flex;flex-direction:column;gap:2px;flex:1}
.card .m .sku{font-family:"IBM Plex Mono",monospace;font-size:.74rem;font-weight:600;color:var(--g600);letter-spacing:.03em}
.card .m b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;font-weight:600;line-height:1.22}
.card .m i{font-style:italic;font-size:.88rem;color:var(--ink-3);line-height:1.34}
.card .m .foot{display:flex;gap:5px;margin-top:auto;padding-top:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:99px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.3);flex-shrink:0}
.dot.Y{background:linear-gradient(135deg,#F0D583,#B58A28)}
.dot.W{background:linear-gradient(135deg,#F4F5F5,#B6BDC0)}
.dot.R{background:linear-gradient(135deg,#F0C0A8,#C0785A)}
.count{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-3)}

/* list view */
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:64px 1fr auto auto;gap:18px;align-items:center;
  background:transparent;border:0;border-bottom:1px solid var(--rule-2);padding:12px 2px;text-align:left}
.row:hover{background:var(--tint)}
.row .pic{width:64px;height:64px;background:var(--plate);border:1px solid var(--rule-2);
  display:grid;place-items:center;padding:5px}
.row .pic img{width:100%;height:100%;object-fit:contain}
.row .sku{font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;color:var(--g600)}
.row b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;font-weight:600;line-height:1.25}
.row i{font-style:italic;font-size:.88rem;color:var(--ink-3)}
@media(max-width:640px){.row{grid-template-columns:56px 1fr}.row .hide-s{display:none}}

/* ---------- feature cards ---------- */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.feats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.feats{grid-template-columns:1fr}}
.feat{background:transparent;border:0;border-top:1px solid var(--rule);padding:18px 0 0;
  display:flex;flex-direction:column;gap:8px}
.band-dark .feat{border-top-color:rgba(255,255,255,.18)}
.feat .ic{color:var(--g600);margin-bottom:2px}
.feat p{font-size:.88rem;color:var(--ink-2)}
.band-dark .feat p{color:var(--onDark-2)}

/* ---------- decoder ---------- */
.dec-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,52px);align-items:center}
@media(max-width:880px){.dec-wrap{grid-template-columns:1fr}}
.decoder{background:transparent;border:0;border-top:1px solid rgba(255,255,255,.2);border-radius:0;padding:20px 0 0}
.decoder.light{background:transparent;border-top-color:var(--rule)}
.code-line{display:flex;flex-wrap:wrap;gap:4px;font-family:"IBM Plex Mono",monospace;font-weight:600;margin-top:14px}
.decoder > .code-line:first-child{margin-top:0}
.seg{font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1;padding:8px 7px 10px;border-radius:6px;cursor:pointer;
  border-bottom:2px solid rgba(255,255,255,.2);transition:all .16s;color:var(--onDark)}
.decoder.light .seg{color:var(--ink);border-bottom-color:var(--rule)}
.seg:hover,.seg.on{background:rgba(227,201,130,.16);border-bottom-color:var(--g300);color:var(--g300)}
.decoder.light .seg:hover,.decoder.light .seg.on{background:var(--g50);border-bottom-color:var(--g500);color:var(--g700)}
.legend{margin-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.decoder.light .legend{border-top-color:var(--rule-2)}
.legend div{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:baseline;padding:8px 5px;
  border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:.86rem}
.decoder.light .legend div{border-bottom-color:var(--rule-2)}
.legend div:last-child{border-bottom:0}
.legend div:hover,.legend div.on{background:rgba(255,255,255,.05)}
.decoder.light .legend div:hover,.decoder.light .legend div.on{background:var(--g50)}
.legend b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--g300)}
.decoder.light .legend b{color:var(--g600)}
.legend span{color:var(--onDark-2)}
.decoder.light .legend span{color:var(--ink-2)}

/* ---------- gauge ---------- */
.gauge{display:flex;align-items:flex-end;gap:clamp(16px,3.4vw,38px);flex-wrap:wrap;background:transparent;
  border:0;border-top:1px solid var(--rule);padding:28px 0 0}
.gauge figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.gauge .bar{height:96px;border-radius:99px;background:var(--metal);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28)}
.gauge figcaption{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-2)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);background:transparent}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.87rem}
th,td{padding:10px 15px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap}
thead th{font-family:"EB Garamond",Georgia,serif;font-size:.95rem;font-style:italic;
  color:var(--ink-2);font-weight:500;background:transparent;border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--tint)}
tr.pick{cursor:pointer}
tr.pick.on{background:var(--g100)}
tr.pick.on td{font-weight:600}
td.num,th.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
td.code{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--g700)}
.grp td{background:transparent;font-weight:600;color:var(--ink);padding-top:22px;
  border-bottom:1px solid var(--ink)}

/* ---------- process ---------- */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:1000px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{background:transparent;border:0;border-top:1px solid var(--rule);padding:16px 0 0}
.step .n{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:.86rem;line-height:1;
  color:var(--g700);display:block;margin-bottom:12px}
.step h3{margin-bottom:6px}
.step p{font-size:.86rem;color:var(--ink-2)}

/* ---------- spec finder ---------- */
.finder{background:transparent;border:0;border-top:1.5px solid var(--ink);padding:22px 0 0}
.finder-controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:18px}
.fc{display:flex;flex-direction:column;gap:8px}
.fc > span{font-family:"EB Garamond",Georgia,serif;font-size:1rem;font-style:italic;
  color:var(--ink-2);font-weight:400}
.seg-ctrl{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg-ctrl button{padding:8px 14px;font-size:.85rem;font-weight:600;color:var(--ink-2);
  border-right:1px solid var(--rule);transition:all .15s}
.seg-ctrl button:last-child{border-right:0}
.seg-ctrl button:hover{background:var(--g50)}
.seg-ctrl button[aria-pressed="true"]{background:var(--ink);color:#FDFBF5}
.finder-out{border:0}
.finder-sum{display:flex;flex-wrap:wrap;gap:34px;padding:0 0 18px;background:transparent;border-bottom:1px solid var(--rule)}
.finder-sum div span{display:block;font-family:"EB Garamond",Georgia,serif;font-size:.98rem;
  font-style:italic;color:var(--ink-2)}
.finder-sum div b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.55rem;color:var(--ink)}

/* ---------- accordion ---------- */
.faq{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.qa{background:transparent;border:0;border-bottom:1px solid var(--rule-2);border-radius:0}
.qa summary{padding:16px 2px;cursor:pointer;font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:600;font-size:1.28rem;display:flex;align-items:center;gap:14px;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:1.25rem;color:var(--g500);line-height:1}
.qa[open] summary::after{content:"−"}
.qa summary:hover{color:var(--g700)}
.qa .a{padding:0 2px 20px;font-size:1rem;color:var(--ink-2);max-width:70ch}

/* ---------- catalogue ---------- */
.cat{display:grid;grid-template-columns:236px 1fr;gap:30px;align-items:start}
@media(max-width:900px){.cat{grid-template-columns:1fr}}
.filters{position:sticky;top:116px;display:flex;flex-direction:column;gap:22px;background:transparent;
  border:0;border-top:1.5px solid var(--ink);padding:18px 0 0}
@media(max-width:900px){.filters{position:static}}
.fgroup > p{font-family:"EB Garamond",Georgia,serif;font-size:1rem;font-style:italic;
  color:var(--ink-2);margin-bottom:9px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:5px 12px;font-size:.92rem;color:var(--ink-2);
  background:transparent;transition:all .15s}
.chip:hover{border-color:var(--g400);color:var(--g700)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FDFBF5;font-weight:600}
.chip .c{font-family:"IBM Plex Mono",monospace;font-size:.68rem;opacity:.6;margin-left:4px}
.toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:9px;padding:10px 12px 10px 38px}
.search input:focus{border-color:var(--g400)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toolbar select{font:inherit;font-size:.86rem;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:9px;padding:10px 12px}
.viewtog{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.viewtog button{padding:9px 11px;color:var(--ink-3)}
.viewtog button[aria-pressed="true"]{background:var(--ink);color:#FDFBF5}
.empty{padding:64px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule);border-radius:13px}
.crumb{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-3);margin-bottom:14px;flex-wrap:wrap}
.crumb button:hover{color:var(--g700)}

/* ---------- product detail ---------- */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,52px);align-items:start}
@media(max-width:900px){.pd{grid-template-columns:1fr}}
.pd-plate{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:30px;aspect-ratio:1/1;
  display:grid;place-items:center;box-shadow:var(--shadow-m);overflow:hidden;cursor:zoom-in;position:relative}
.pd-plate img{width:100%;height:100%;object-fit:contain;transition:transform .25s}
.pd-plate.zoom img{transform:scale(2.3)}
.zoom-hint{position:absolute;right:12px;bottom:12px;background:rgba(35,26,12,.78);color:var(--g200);
  font-size:.7rem;padding:5px 10px;border-radius:99px;font-family:"IBM Plex Mono",monospace;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:.88rem;margin:18px 0 22px}
.kv dt{color:var(--ink-2);font-family:"EB Garamond",Georgia,serif;font-size:1rem;
  font-style:italic;padding-top:1px;font-weight:400}
.kv dd{margin:0;font-weight:500}
.sizepick{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 18px}
.sizepick button{border:1px solid var(--rule);border-radius:2px;padding:8px 13px;
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--ink-2);transition:all .15s}
.sizepick button:hover{border-color:var(--g400);color:var(--g700)}
.sizepick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FDFBF5}

/* ---------- quote drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,20,9,.55);backdrop-filter:blur(2px);z-index:90;animation:fadein .2s}
.quote-drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--paper);
  z-index:95;display:flex;flex-direction:column;box-shadow:var(--shadow-l);animation:slidein .26s cubic-bezier(.2,.7,.3,1)}
.qd-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--rule);background:var(--g50)}
.qd-head h3{font-size:1.05rem}
.qd-close{margin-left:auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.qd-close:hover{background:var(--rule-2);color:var(--ink)}
.qd-body{flex:1;overflow-y:auto;padding:16px 20px}
.qd-foot{border-top:1px solid var(--rule);padding:16px 20px;display:flex;flex-direction:column;gap:11px;background:var(--card)}
.qline{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule-2)}
.qline:last-child{border-bottom:0}
.qline .pic{width:52px;height:52px;background:var(--plate);border:1px solid var(--rule-2);border-radius:8px;
  display:grid;place-items:center;padding:4px}
.qline .pic img{width:100%;height:100%;object-fit:contain}
.qline .sku{font-family:"IBM Plex Mono",monospace;font-size:.79rem;font-weight:600;color:var(--g600)}
.qline b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.08rem;font-weight:600;line-height:1.25}
.qline .sz{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.stepper button{width:26px;height:30px;color:var(--ink-2);font-size:1rem;line-height:1}
.stepper button:hover{background:var(--g50);color:var(--g700)}
.stepper input{width:44px;height:30px;border:0;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:.82rem;background:transparent;color:var(--ink);border-inline:1px solid var(--rule)}
.qdrop{color:var(--ink-3);font-size:1rem;padding:3px 6px;border-radius:5px;margin-left:6px}
.qdrop:hover{background:var(--g100);color:#B4552F}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal-box{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-l);max-width:820px;width:100%;
  max-height:88vh;overflow-y:auto;pointer-events:auto;animation:rise .26s cubic-bezier(.2,.7,.3,1)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr}}
.modal .pic{background:var(--plate);border:1px solid var(--rule);border-radius:12px;aspect-ratio:1/1;
  display:grid;place-items:center;padding:20px}
.modal .pic img{width:100%;height:100%;object-fit:contain}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--rule);display:grid;place-items:center;z-index:2}

/* ---------- forms / basket ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:17px;background:transparent;border:0;padding:0}
@media(max-width:700px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field label{font-family:"EB Garamond",Georgia,serif;font-size:1rem;font-style:italic;
  color:var(--ink-2);font-weight:400}
.field input,.field select,.field textarea{font:inherit;font-size:.91rem;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;padding:10px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g400)}
.field textarea{min-height:100px;resize:vertical}
.field ::placeholder{color:var(--ink-3)}
.basket{background:transparent;border:0;border-top:1.5px solid var(--ink);padding:18px 0 0}

.note{border-top:1px solid var(--rule);background:transparent;border-radius:0;
  padding:13px 0 0;font-size:.98rem;color:var(--ink-2);max-width:60ch}
.note b{color:var(--ink)}
.band-dark .note{background:transparent;border-top-color:rgba(255,255,255,.18);color:var(--onDark-2)}
.band-dark .note b{color:var(--onDark)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,3.5vw,46px);align-items:start}
@media(max-width:860px){.cols2{grid-template-columns:1fr}}
.jobs{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.job{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:transparent;
  border:0;border-bottom:1px solid var(--rule-2);padding:18px 2px}
.job p{font-size:.85rem;color:var(--ink-2);margin-top:3px}
.cta-band{background:transparent;border-top:1.5px solid var(--ink);border-radius:0;
  padding:clamp(28px,4vw,44px) 0 0;color:var(--ink)}
.cta-band h2{color:var(--ink)}
.cta-band p{color:var(--ink-2);max-width:52ch;margin-top:11px}

/* ---------- footer ---------- */
footer{background:var(--espresso);color:var(--onDark-2);padding-block:52px 26px}
footer .logo{width:250px;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;gap:34px}
@media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.fgrid{grid-template-columns:1fr}}
footer h4{font-family:"EB Garamond",Georgia,serif;font-size:1.02rem;font-style:italic;
  color:var(--g300);margin-bottom:14px;font-weight:400}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:.87rem}
footer a:hover{color:var(--g300)}
footer .socials{display:flex;gap:9px;margin-top:16px}
footer .socials a{width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;transition:all .16s}
footer .socials a:hover{background:var(--g400);border-color:transparent;color:#241B0A}
.colophon{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:.78rem;
  display:flex;gap:18px 24px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:#8E7F66}
.bct{display:block;flex-shrink:0;width:168px;transition:opacity .18s}
.bct:hover{opacity:.82}
.bct svg{width:100%;height:auto;display:block}
@media(max-width:640px){.bct{width:148px}}

/* ---------- floating ---------- */
.floats{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:9px}
.floats a,.floats button{width:48px;height:48px;border-radius:99px;display:grid;place-items:center;
  box-shadow:var(--shadow-m);border:1px solid rgba(255,255,255,.25);transition:transform .16s}
.floats a:hover,.floats button:hover{transform:scale(1.07)}
.f-zalo{background:#0068FF;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;
  font-weight:800;font-size:.76rem;letter-spacing:-.02em}
.f-tel{background:var(--g700);color:#FDFBF5}
.f-top{background:var(--espresso);color:var(--g300)}
@media(max-width:640px){.floats{right:12px;bottom:12px}.floats a,.floats button{width:44px;height:44px}}

/* ---------- product detail, editorial layout ---------- */
.pdp{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(28px,4.5vw,64px);align-items:start}
@media(max-width:920px){.pdp{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:start}
@media(max-width:520px){.gal{grid-template-columns:1fr}}
.gal-thumbs{display:flex;flex-direction:column;gap:10px}
@media(max-width:520px){.gal-thumbs{flex-direction:row;order:2}}
.gal-thumbs button{background:var(--plate);border:1px solid var(--rule-2);border-radius:0;
  aspect-ratio:1/1;padding:6px;display:grid;place-items:center;transition:border-color .16s}
.gal-thumbs button img{width:100%;height:100%;object-fit:contain}
.gal-thumbs button[aria-current="true"]{border-color:var(--g500);box-shadow:0 0 0 1px var(--g500)}
.gal-thumbs button:hover{border-color:var(--g400)}
.gal-main{position:relative;background:var(--plate);border:1px solid var(--rule-2);border-radius:0;
  aspect-ratio:1/1;display:grid;place-items:center;padding:28px;overflow:hidden;cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:contain;transition:transform .28s}
.gal-main.zoom img{transform:scale(2.3)}
.gal-count{position:absolute;right:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;
  font-size:.72rem;color:#3B2C1A;opacity:.45;pointer-events:none}

.pdp-eyebrow{margin-bottom:14px}
.pdp h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;text-transform:uppercase;
  letter-spacing:.03em;font-size:clamp(2rem,3.6vw,3rem);line-height:1.06;margin:0 0 8px}
.pdp .sub{font-style:italic;color:var(--ink-3);font-size:1.05rem}
.pdp hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.pdp .desc{color:var(--ink-2);font-size:1.02rem;max-width:56ch}
.spec-list{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.spec-list li{font-size:.98rem;padding-left:16px;position:relative}
.spec-list li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:1px;background:var(--rule)}
.spec-list b{font-weight:600;color:var(--ink)}
.spec-list span{color:var(--ink-2)}
.pdp-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
.back-link{display:inline-flex;align-items:center;gap:8px;margin-top:22px;
  font-family:"EB Garamond",Georgia,serif;font-size:1rem;font-style:italic;color:var(--g700)}
.back-link:hover{color:var(--g700)}

/* three points, roman-numbered */

/* related, quiet grid */
.rels{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:900px){.rels{grid-template-columns:repeat(2,1fr)}}
.rel{text-align:left;display:flex;flex-direction:column;gap:11px}
.rel .plate{background:var(--plate);border:1px solid var(--rule-2);border-radius:0;aspect-ratio:1/1;
  display:grid;place-items:center;padding:18px;overflow:hidden;transition:border-color .16s}
.rel:hover .plate{border-color:var(--g400)}
.rel .plate img{width:100%;height:100%;object-fit:contain}

.rel b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem;font-weight:600;line-height:1.2}
.rel span{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--g700)}

/* ---------- hero: photographic, on espresso ---------- */
.hero{position:relative;background:#151007;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(58% 62% at 66% 42%, rgba(214,178,92,.26), transparent 68%),
             radial-gradient(80% 70% at 12% 10%, rgba(120,92,34,.20), transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 26%,transparent 72%,rgba(0,0,0,.42))}
.hero > *{position:relative;z-index:1}
.slide-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:clamp(24px,4vw,64px);align-items:center;
  padding-block:clamp(56px,7vw,104px) clamp(96px,10vw,140px)}
@media(max-width:900px){.slide-grid{grid-template-columns:1fr;padding-bottom:120px}}
.hero-copy h1{margin:18px 0 18px;color:#F6EEDC}
.hero-copy .lede{color:#C8B694;max-width:50ch;font-style:italic}
.hero .eyebrow{color:var(--g300)}
.hero .eyebrow::before{background:var(--g400)}
.hero .cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero .btn-line{border-color:rgba(246,238,220,.34);color:#F6EEDC;background:transparent}
.hero .btn-line:hover{background:rgba(246,238,220,.09)}
.hero-art{position:relative;display:grid;place-items:center;
  width:100%;max-width:540px;aspect-ratio:1/1;margin-inline:auto}
.hero-art::before{content:"";position:absolute;width:82%;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle, rgba(232,205,140,.20), transparent 66%)}
.hero-cut{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;
  filter:drop-shadow(0 26px 44px rgba(0,0,0,.6))}
.hero-tag{position:absolute;left:0;bottom:-22px;display:flex;align-items:baseline;gap:10px}
.hero-tag b{font-family:"IBM Plex Mono",monospace;font-size:.92rem;letter-spacing:.06em;color:var(--g300)}
.hero-tag span{font-size:.86rem;color:#9B8B6B;font-style:italic}

.dots button{width:30px;height:3px;border-radius:99px;background:rgba(246,238,220,.28);transition:background .2s,width .2s}
.dots button[aria-current="true"]{background:var(--g300);width:54px}
.arrows button{width:40px;height:40px;border-radius:99px;border:1px solid rgba(246,238,220,.26);
  display:grid;place-items:center;color:#F6EEDC;background:transparent;transition:all .18s}
.arrows button:hover{background:var(--g400);color:#241B0A;border-color:transparent}

/* ---------- by the numbers, floated over the hero edge ---------- */
.numbers{position:relative;margin-top:-64px;z-index:5}
.numbers .card-in{background:var(--paper);border:0;border-radius:0;
  box-shadow:0 -1px 0 var(--rule);padding:clamp(30px,3.8vw,52px) clamp(24px,3vw,44px)}
.numbers .head{text-align:center;margin-bottom:30px}
.numbers .head h2{margin-top:10px}
.numbers .head p{color:var(--ink-2);max-width:60ch;margin:10px auto 0}
.ngrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--rule-2)}
@media(max-width:1000px){.ngrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.ngrid{grid-template-columns:repeat(2,1fr)}}
.ncell{background:var(--card);padding:22px 14px;text-align:center}
.ncell b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:clamp(2.2rem,3.6vw,3.1rem);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ncell i{font-style:normal;font-size:.7em;color:var(--g500)}
.ncell span{display:block;margin-top:7px;font-family:"EB Garamond",Georgia,serif;
  font-size:.98rem;color:var(--ink-2)}

/* ---------- who we work for ---------- */
.who{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,58px);align-items:start}
@media(max-width:880px){.who{grid-template-columns:1fr}}
.pillars{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.pillar{padding:20px 0;border-bottom:1px solid var(--rule-2);display:grid;grid-template-columns:34px 1fr;gap:16px}
.pillar .pi{color:var(--g500);padding-top:2px}
.pillar h3{margin-bottom:5px}
.pillar p{font-size:.94rem;color:var(--ink-2)}
.clients{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px}
.clients span{font-family:"EB Garamond",Georgia,serif;font-size:1rem;color:var(--ink);
  border:0;border-bottom:1px solid var(--g400);padding:0 0 2px}

/* ---------- purity cards ---------- */
.alloys{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.alloys{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.alloys{grid-template-columns:1fr}}
.alloy{background:transparent;border:0;border-top:1.5px solid var(--ink);padding:16px 0 0;
  display:flex;flex-direction:column;gap:5px}
.alloy .k{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;font-weight:500;
  line-height:1;color:var(--g700)}
.alloy .au{font-family:"IBM Plex Mono",monospace;font-size:.84rem;color:var(--ink-2)}
.alloy .kt{font-family:"EB Garamond",Georgia,serif;font-size:1rem;color:var(--ink);font-weight:600}
.alloy .note{margin-top:auto;padding-top:12px;font-size:.86rem;color:var(--ink-3);font-style:italic}

.stat{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap}
.stat::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ink-3);flex-shrink:0;
  align-self:center}
.stat.yes::before{background:#3E7A4E}
.stat.no::before{background:#B0894A}
td .stat{font-size:.9rem}
.a ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.a li{padding-left:2px}
.qa summary .role{font-family:"Cormorant Garamond",Georgia,serif}
.apply{border-top:1.5px solid var(--ink);padding-top:20px;margin-top:26px;
  display:grid;grid-template-columns:auto 1fr;gap:10px 26px;align-items:baseline;max-width:70ch}
.apply dt{font-family:"EB Garamond",Georgia,serif;font-style:italic;color:var(--ink-2)}
.apply dd{margin:0}
.linkish{font:inherit;color:var(--g700);text-decoration:underline;text-underline-offset:3px;
  padding:0;background:none;border:0;cursor:pointer}
.linkish:hover{color:var(--ink)}
.hidden{display:none!important}

<script>
(function(){
"use strict";
const P = DATA.products, SPECS = DATA.specs;
let lang="vi", view={name:"home"}, rfq=[], slide=0, timer=null;
let catUI = {q:"", sort:"code", mode:"grid"};
let pdSize = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = (vi,en) => lang==="vi" ? vi : en;
const num = n => n==null ? "—" : (Math.round(n*1000)/1000).toLocaleString(lang==="vi"?"vi-VN":"en-US");
const mm  = d => lang==="vi" ? Number(d).toFixed(1).replace(".",",") : Number(d).toFixed(1);
const len = x => String(x||"—").replace(/\s*cm\s*$/i," cm").replace(/\s*-\s*/,"–").trim();
const prod = code => P.find(x=>x.ag===code);
const availOf = code => (DATA.avail && DATA.avail[String(code||"").toUpperCase()]) || null;
function statusHTML(a){
  if(!a) return `<span style="color:var(--ink-3)">${t("hỏi phòng kinh doanh","ask the sales desk")}</span>`;
  return a.can
    ? `<span class="stat yes">${t("Đặt được ngay","Available to order")}</span>`
    : `<span class="stat no">${t("Làm theo đơn — hỏi trước","Made to order — ask first")}</span>`;
}
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- the mark, rebuilt as vector ---------- */
function logoSVG(cls,w){
  const id = "ag-" + (logoSVG.k = (logoSVG.k||0)+1);
  return `<svg class="logo ${cls||""}" width="${w||180}" viewBox="0 0 600 220"
      role="img" aria-label="Asiana Gold — Pure Gold Chain">
    <defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="20" y1="24" x2="580" y2="196">
      <stop offset="0" style="stop-color:var(--lg1)"/><stop offset=".2" style="stop-color:var(--lg2)"/>
      <stop offset=".42" style="stop-color:var(--lg3)"/><stop offset=".64" style="stop-color:var(--lg4)"/>
      <stop offset=".84" style="stop-color:var(--lg5)"/><stop offset="1" style="stop-color:var(--lg6)"/>
    </linearGradient></defs>
    <g stroke="url(#${id})" stroke-width="5.5" fill="none">
      <path d="M20 58H236"/><path d="M364 58H580"/>
      <path d="M20 58V185"/><path d="M580 58V185"/>
      <path d="M20 185H172"/><path d="M428 185H580"/>
    </g>
    <g fill="none" stroke="url(#${id})" stroke-width="11">
      <rect x="247" y="35.5" width="57" height="45" rx="11"/>
      <rect x="296" y="35.5" width="57" height="45" rx="11"/>
    </g>
    <text x="300" y="155" text-anchor="middle" fill="url(#${id})"
      font-family="Archivo, 'Arial Black', 'Helvetica Neue', sans-serif"
      font-weight="900" font-style="italic" font-size="80" letter-spacing="-1">Asiana Gold</text>
    <text x="300" y="192" text-anchor="middle" fill="url(#${id})"
      font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"
      font-weight="500" font-size="19" letter-spacing="4.2">PURE GOLD CHAIN</text>
  </svg>`;
}
const LINKMARK = `<svg width="34" height="15" viewBox="0 0 168 60" fill="none" stroke="currentColor" stroke-width="10" aria-hidden="true">
  <rect x="7" y="8" width="78" height="44" rx="12"/><rect x="83" y="8" width="78" height="44" rx="12"/></svg>`;

/* ---------- derived ---------- */
const FAMS=[];
P.forEach(p=>{ let f=FAMS.find(x=>x.vi===p.secVi);
  if(!f){f={vi:p.secVi,en:p.secEn,n:0,cover:p};FAMS.push(f);} f.n++; });
const DIAS=[...new Set(P.flatMap(p=>p.dia))].sort((a,b)=>a-b);
const gaugeOf = code => { const m=/^C[YW](\d\d)/.exec(code); return m ? +m[1]/10 : null; };
const SPEC_GAUGES=[...new Set(SPECS.flatMap(g=>g.rows.map(r=>gaugeOf(r.y))).filter(Boolean))].sort((a,b)=>a-b);
const PURITIES=[
  {k:"750", au:"75,0", auEn:"75.0", kt:"18K",      ktEn:"18K",      spec:true},
  {k:"680", au:"68,0", auEn:"68.0", kt:"≈ 16,3K",  ktEn:"≈ 16.3K",  spec:false},
  {k:"610", au:"61,0", auEn:"61.0", kt:"≈ 14,6K",  ktEn:"≈ 14.6K",  spec:true},
  {k:"416", au:"41,6", auEn:"41.6", kt:"10K",      ktEn:"10K",      spec:false}
];
const PURITY_LINE = PURITIES.map(x=>x.k).join(" · ");
const PAGES=[["home","Trang chủ","Home"],["catalogue","Catalogue","Catalogue"],
  ["capacity","Năng lực xưởng","Capabilities"],["careers","Tuyển dụng","Careers"],["contact","Liên hệ","Contact"]];

/* ---------- code decoder ---------- */
function segment(code,decode){
  const segs=[]; let i=0;
  (decode||[]).forEach(pair=>{
    const key=(pair[0]||"").trim(), val=(pair[1]||"").trim();
    if(!key) return;
    if(/^ĐK/i.test(key)){
      const m=code.slice(i).match(/^[\d.]+/);
      if(m){ segs.push({txt:m[0],val:val,kind:"dia"}); i+=m[0].length; return; }
    }
    if(code.slice(i,i+key.length).toUpperCase()===key.toUpperCase()){
      segs.push({txt:code.slice(i,i+key.length),val:val}); i+=key.length; return;
    }
    segs.push({txt:"",val:val});
  });
  if(i<code.length) segs.push({txt:code.slice(i),val:""});
  return segs.filter(s=>s.txt);
}
function decoderHTML(p,light){
  const segs=segment(p.ag,p.decode); if(!segs.length) return "";
  return `<div class="decoder${light?" light":""}">
    <div class="code-line">${segs.map((s,k)=>`<span class="seg" data-k="${k}">${esc(s.txt)}</span>`).join("")}</div>
    <div class="legend">${segs.map((s,k)=>{
      const label=s.kind==="dia"?t("Đường kính "+mm(s.txt/10)+" mm","Diameter "+mm(s.txt/10)+" mm"):s.val;
      return `<div data-k="${k}"><b>${esc(s.txt)}</b><span>${esc(label)}</span></div>`;}).join("")}</div>
  </div>`;
}
function wireDecoder(root){
  root.querySelectorAll(".decoder").forEach(d=>{
    const set=k=>d.querySelectorAll("[data-k]").forEach(el=>el.classList.toggle("on",el.dataset.k===k));
    d.querySelectorAll(".seg,.legend div").forEach(el=>{
      el.addEventListener("mouseenter",()=>set(el.dataset.k));
      el.addEventListener("click",()=>set(el.dataset.k));
    });
    d.addEventListener("mouseleave",()=>set(null));
  });
}

/* ---------- cards ---------- */
function cardHTML(p){
  return `<div class="card">
    <div class="pic" data-go="${esc(p.ag)}" style="cursor:pointer">
      <img src="${p.img}" alt="${esc(p.vi)}" loading="lazy">
      <span class="quick" data-quick="${esc(p.ag)}">${t("Xem nhanh","Quick view")}</span>
    </div>
    <div class="m" data-go="${esc(p.ag)}" style="cursor:pointer">
      <span class="sku">${esc(p.ag)}</span>
      <b>${esc(t(p.vi,p.en||p.vi))}</b>
      <i>${esc(t(p.en||"",p.vi))}</i>
      <span class="foot">${p.colors.map(c=>`<span class="dot ${c}"></span>`).join("")}
        ${p.avail && p.avail.can?`<span class="stat yes count" style="margin-left:6px">${t("Sẵn","Ready")}</span>`:""}
        ${p.spec?`<span class="count" style="margin-left:auto">${p.spec.rows.length} ${t("cỡ","sizes")}</span>`:""}</span>
    </div>
  </div>`;
}
function rowHTML(p){
  return `<button class="row" data-go="${esc(p.ag)}">
    <span class="pic"><img src="${p.img}" alt="" loading="lazy"></span>
    <span><span class="sku">${esc(p.ag)}</span><b>${esc(t(p.vi,p.en||p.vi))}</b><i>${esc(t(p.en||"",p.vi))}</i></span>
    <span class="hide-s" style="display:flex;gap:5px">${p.colors.map(c=>`<span class="dot ${c}"></span>`).join("")}</span>
    <span class="count hide-s">${p.spec?p.spec.rows.length+" "+t("cỡ","sizes"):t("theo đơn","per order")}</span>
  </button>`;
}
const ICONS={

let pdPhoto = 0;

/* a description assembled from the sheet, never invented */
function blurb(p){
  const g = p.dia.length ? p.dia.map(mm).join(" · ") + " mm" : null;
  const cols = p.colors.map(c=>t({Y:"vàng",W:"trắng",R:"hồng"}[c],{Y:"yellow",W:"white",R:"rose"}[c])).join(t(", "," / "));
  const kind = p.kind==="bracelet" ? t("Lắc tay","A bracelet") : t("Dây chuyền","A chain");
  const bits = [];
  bits.push(t(
    kind+" "+p.vi.toLowerCase().replace(/^(dây|lắc)\s+/,"")+(g?", đường kính "+g:"")+".",
    (p.en||p.vi)+(g?", "+g+" gauge":"")+"."));
  bits.push(t(
    "Đúc và đan tại xưởng Asiana Gold, làm được ở tuổi vàng "+PURITY_LINE+", màu "+cols+".",
    "Drawn and woven at the Asiana Gold factory in "+PURITY_LINE+" gold, "+cols+"."));
  if(p.spec){
    const L = p.spec.rows.map(r=>r.length).filter(Boolean);
    const tidy = x => String(x||"").replace(/\s*cm\s*$/i," cm").trim();
    const lo = L.length?tidy(L[0].split("-")[0]):null, hi = L.length?tidy(L[L.length-1].split("-").pop()):null;
    bits.push(t(
      "Bảng quy cách có "+p.spec.rows.length+" cỡ tiêu chuẩn"+(lo?", chiều dài "+lo+" đến "+hi:"")+", trọng lượng ghi sẵn cả chỉ lẫn gram.",
      p.spec.rows.length+" standard sizes"+(lo?", lengths "+lo+" to "+hi:"")+", weights listed in both chỉ and grams."));
  } else {
    bits.push(t("Mẫu này báo quy cách theo từng đơn hàng.","Specifications for this model are quoted per order."));
  }
  return bits.join(" ");
}

function rfqListHTML(editable){
  if(!rfq.length) return `<p style="color:var(--ink-3);font-size:.87rem">${t(
    "Chưa chọn mẫu nào. Vào catalogue và bấm “Thêm vào yêu cầu báo giá”.",
    "Nothing selected yet. Open the catalogue and use “Add to quote request”.")}</p>`;
  return rfq.map((it,i)=>{
    const p = prod(it.ag); if(!p) return "";
    return `<div class="qline">
      <span class="pic"><img src="${p.img}" alt=""></span>
      <span><span class="sku">${esc(it.size||p.ag)}</span><b>${esc(t(p.vi,p.en||p.vi))}</b>
        ${it.size&&it.size!==p.ag?`<span class="sz">${t("mã dòng","family")} ${esc(p.ag)}</span>`:""}</span>
      <span style="display:flex;align-items:center">
        ${editable?`<span class="stepper"><button data-qty="${i}" data-d="-1" aria-label="−">−</button>
          <input value="${it.qty}" data-qtyin="${i}" inputmode="numeric" aria-label="${t("Số lượng","Quantity")}">
          <button data-qty="${i}" data-d="1" aria-label="+">+</button></span>
          <button class="qdrop" data-del="${i}" aria-label="${t("Bỏ","Remove")}">×</button>`
        :`<span class="mono count">× ${it.qty}</span>`}
      </span></div>`;
  }).join("");
}

/* ---------- layer control ---------- */
let layer = null;
function openLayer(kind, arg){
  layer = {kind:kind, arg:arg};
  $("#layer").innerHTML = kind==="quote" ? drawerHTML() : quickHTML(arg);
  document.body.classList.add("locked");
}
function closeLayer(){ layer=null; $("#layer").innerHTML=""; document.body.classList.remove("locked"); }
function refreshLayer(){ if(layer) openLayer(layer.kind, layer.arg); }


/* ---------------- routing ----------------
   Real paths where the page owns its address bar (the Vercel deploy).
   Falls back to a hash route inside an artifact iframe or a file:// copy,
   where pushState either throws or would point at a URL nothing serves. */
const PATH_MODE = (location.protocol === "http:" || location.protocol === "https:")
  && window.top === window.self
  && !/\/artifact\//.test(location.pathname);
let muteHash = false;

function slugify(x){
  return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[đĐ]/g, "d")            // đ / Đ survive NFD, so map them by hand
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
const famBySlug = m => FAMS.find(f => slugify(f.vi) === m);

function currentURL(){
  let path;
  if(view.name === "product")                     path = "/product/" + encodeURIComponent(view.code);
  else if(view.name === "catalogue" && filt.fam)  path = "/catalogue/" + slugify(filt.fam);
  else                                            path = "/" + view.name;
  const q = new URLSearchParams();
  if(lang === "en") q.set("lang", "en");
  if(view.name === "product" && pdSize) q.set("size", pdSize);
  if(view.name === "catalogue"){
    if(catUI.q)            q.set("q", catUI.q);
    if(filt.kind)          q.set("kind", filt.kind);
    if(filt.color)         q.set("color", filt.color);
    if(filt.dia)           q.set("dia", filt.dia);
    if(filt.mat)           q.set("mat", filt.mat);
    if(catUI.sort !== "code") q.set("sort", catUI.sort);
    if(catUI.mode !== "grid") q.set("view", catUI.mode);
  }
  const qs = q.toString();
  return path + (qs ? "?" + qs : "");
}

function writeURL(replace){
  const url = currentURL();
  try{
    if(PATH_MODE){
      history[replace ? "replaceState" : "pushState"](null, "", url);
    }else{
      muteHash = true;
      history[replace ? "replaceState" : "pushState"](null, "", "#" + url);
      setTimeout(()=>{ muteHash = false; }, 0);
    }
  }catch(e){ /* sandboxed host: stay on the current address */ }
}

function readURL(){
  const raw = PATH_MODE ? location.pathname + location.search
                        : (location.hash.slice(1) || "/home");
  const cut = raw.split("?");
  const q = new URLSearchParams(cut[1] || "");
  const l = q.get("lang");
  if(l === "en" || l === "vi") lang = l;

  const seg = cut[0].split("/").filter(Boolean);
  const head = seg[0] || "home";
  filt  = {fam:null, kind:null, color:null, dia:null, mat:null};
  catUI = {q:"", sort:"code", mode:"grid"};
  pdSize = null; pdPhoto = 0;

  if(head === "product" && seg[1]){
    const code = decodeURIComponent(seg[1]);
    view = prod(code) ? {name:"product", code:code} : {name:"catalogue"};
    const sz = q.get("size");
    if(sz){
      const pr = prod(code);
      if(pr && pr.spec && pr.spec.rows.some(r => r.y === sz)) pdSize = sz;
    }
  }else if(head === "catalogue"){
    view = {name:"catalogue"};
    if(seg[1]){ const f = famBySlug(seg[1]); if(f) filt.fam = f.vi; }
    catUI.q    = q.get("q") || "";
    filt.kind  = q.get("kind") || null;
    filt.color = q.get("color") || null;
    filt.dia   = q.get("dia") ? parseFloat(q.get("dia")) : null;
    filt.mat   = q.get("mat") || null;
    catUI.sort = q.get("sort") || "code";
    catUI.mode = q.get("view") === "list" ? "list" : "grid";
  }else if(head === "capacity" || head === "careers" || head === "contact" || head === "home"){
    view = {name:head};
  }else{
    view = {name:"home"};
  }
}

function pageTitle(){
  const brand = "Asiana Gold";
  if(view.name === "product"){
    const pr = prod(view.code);
    return pr ? (pdSize || pr.ag) + " " + t(pr.vi, pr.en || pr.vi) + " · " + brand : brand;
  }
  const names = {home:brand, catalogue:"Catalogue · " + brand,
    capacity:t("Năng lực sản xuất","Capabilities") + " · " + brand,
    careers:t("Tuyển dụng","Careers") + " · " + brand,
    contact:t("Liên hệ","Contact") + " · " + brand};
  return names[view.name] || brand;
}

window.addEventListener("popstate", ()=>{ readURL(); render(); });
window.addEventListener("hashchange", ()=>{ if(!muteHash){ readURL(); render(); } });

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = lang;
  document.title = pageTitle();
  $("#hdr-logo").innerHTML = logoSVG("",240);
  $("#foot-logo").innerHTML = logoSVG("on-dark",250);
  $("#nav").innerHTML = PAGES.map(([k,vi,en])=>{
    if(k==="catalogue") return `<span class="navitem"><button data-nav="catalogue"${view.name==="catalogue"||view.name==="product"?' aria-current="page"':""}>${t(vi,en)}</button>
      <div class="mega">${FAMS.slice().sort((a,b)=>b.n-a.n).slice(0,12).map(f=>`<button data-fam="${esc(f.vi)}">
        <span class="th"><img src="${f.cover.img}" alt="" loading="lazy"></span>
        <span><b>${esc(t(f.vi,f.en||f.vi))}</b><i>${f.n} ${t("mẫu","models")}</i></span></button>`).join("")}
        <button data-nav="catalogue" class="mega-all">${t("Xem cả "+FAMS.length+" dòng sản phẩm","All "+FAMS.length+" product families")}</button></div></span>`;
    return `<button data-nav="${k}"${view.name===k?' aria-current="page"':""}>${t(vi,en)}</button>`;
  }).join("");
  $("#drawer-nav").innerHTML = PAGES.map(([k,vi,en])=>`<button data-nav="${k}">${t(vi,en)}</button>`).join("");
  const topFams = FAMS.slice().sort((a,b)=>b.n-a.n);
  $("#foot-fams").innerHTML =
    topFams.slice(0,8).map(f=>`<li><a href="#" data-fam="${esc(f.vi)}">${esc(t(f.vi,f.en||f.vi))}</a></li>`).join("")
    + `<li><a href="#" data-nav="catalogue" style="color:var(--g300)">${t("Xem cả "+FAMS.length+" dòng","All "+FAMS.length+" families")}</a></li>`;

  const app = $("#app");
  app.innerHTML =
      view.name==="catalogue" ? catalogueHTML()
    : view.name==="product"   ? productHTML(view.code)
    : view.name==="capacity"  ? capacityHTML()
    : view.name==="careers"   ? careersHTML()
    : view.name==="contact"   ? contactHTML()
    : homeHTML();

  document.querySelectorAll("[data-vi]").forEach(el=>{ el.textContent = el.dataset[lang]; });
  $("#lang-vi").setAttribute("aria-pressed", String(lang==="vi"));
  $("#lang-en").setAttribute("aria-pressed", String(lang==="en"));
  $("#rfq-n").textContent = rfq.length;
  $("#drawer-nav").classList.remove("open");
  wireDecoder(app);
  wireExtras();
  animateCounts(app);
  startSlides();
  window.scrollTo({top:0,behavior:"instant"});
}
function go(name,extra){
  if(name!=="product" || (extra&&extra.code!==view.code)){ pdSize=null; pdPhoto=0; }
  view=Object.assign({name:name},extra||{});
  render(); writeURL(false);
}
/* filter and language changes rewrite the address without stacking history */
function reflow(){ render(); writeURL(true); }

/* ---------- carousel ---------- */
function showSlide(i){
  const slides=[...document.querySelectorAll(".slide")]; if(!slides.length) return;
  slide=(i+slides.length)%slides.length;
  slides.forEach((s,k)=>{ s.classList.toggle("on",k===slide); s.setAttribute("aria-hidden",String(k!==slide)); });
  document.querySelectorAll("[data-slide-go]").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.slideGo===slide)));
}
function startSlides(){
  clearInterval(timer);
  if(view.name!=="home") return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  timer=setInterval(()=>showSlide(slide+1),7000);
}

/* ---------- non-delegated wiring ---------- */
function animateCounts(root){
  const els = root.querySelectorAll("[data-count]");
  if(!els.length) return;
  if(!("IntersectionObserver" in window) ||
     window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      const end = +el.dataset.count; if(!isFinite(end)) return;
      const t0 = performance.now(), dur = 950;
      const step = now => {
        const k = Math.min(1,(now-t0)/dur);
        el.textContent = Math.round(end * (1 - Math.pow(1-k,3)));
        if(k < 1) requestAnimationFrame(step); else el.textContent = end;
      };
      requestAnimationFrame(step);
    });
  },{threshold:.45});
  els.forEach(el=>io.observe(el));
}

function wireExtras(){
  const q=$("#q");
  if(q){
    q.addEventListener("input",()=>{
      catUI.q=q.value; const pos=q.selectionStart;
      reflow(); const nq=$("#q"); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(e){} }
    });
  }
  const s=$("#sort"); if(s) s.addEventListener("change",()=>{ catUI.sort=s.value; reflow(); });
  const plate=$("#gal-main");
  if(plate){
    plate.addEventListener("mousemove",e=>{
      const r=plate.getBoundingClientRect(), img=plate.querySelector("img");
      img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%";
    });
    plate.addEventListener("mouseenter",()=>plate.classList.add("zoom"));
    plate.addEventListener("mouseleave",()=>plate.classList.remove("zoom"));
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if(e.target.closest("[data-close-layer]")){ closeLayer(); return; }
  if(e.target.closest("#open-quote")||e.target.closest("#open-quote-2")){ openLayer("quote"); return; }
  if(e.target.closest("#burger")){ $("#drawer-nav").classList.toggle("open"); return; }
  if(e.target.closest("#to-top")){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(e.target.closest("#lang-vi")){ lang="vi"; store.set("ag-lang","vi"); reflow(); refreshLayer(); return; }
  if(e.target.closest("#lang-en")){ lang="en"; store.set("ag-lang","en"); reflow(); refreshLayer(); return; }
  if(e.target.closest("#theme-btn")){
    const cur=document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : cur==="light" ? "dark"
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme",next); store.set("ag-theme",next); return;
  }

  const q=e.target.closest("[data-quick]");
  if(q){ e.stopPropagation(); openLayer("quick", q.dataset.quick); return; }

  const step=e.target.closest("[data-slide-step]");
  if(step){ showSlide(slide+ +step.dataset.slideStep); startSlides(); return; }
  const dot=e.target.closest("[data-slide-go]");
  if(dot){ showSlide(+dot.dataset.slideGo); startSlides(); return; }

  const nav=e.target.closest("[data-nav]");
  if(nav){ e.preventDefault(); closeLayer(); go(nav.dataset.nav); return; }
  const fam=e.target.closest("[data-fam]");
  if(fam){ e.preventDefault(); closeLayer(); filt={fam:fam.dataset.fam,kind:null,color:null,dia:null,mat:null}; catUI.q=""; go("catalogue"); return; }
  const goCard=e.target.closest("[data-go]");
  if(goCard){ closeLayer(); go("product",{code:goCard.dataset.go}); return; }

  const chip=e.target.closest("[data-f]");
  if(chip){ const k=chip.dataset.f; let v=chip.dataset.v; if(k==="dia") v=parseFloat(v);
    filt[k]=(String(filt[k])===String(v))?null:v; reflow(); return; }
  if(e.target.closest("#clear")){ filt={fam:null,kind:null,color:null,dia:null,mat:null}; catUI.q=""; reflow(); return; }
  const vt=e.target.closest("[data-view]");
  if(vt){ catUI.mode=vt.dataset.view; reflow(); return; }

  const photo=e.target.closest("[data-photo]");
  if(photo){ pdPhoto=+photo.dataset.photo; render(); return; }  /* gallery: not a page change */
  const size=e.target.closest("[data-size]");
  if(size){ pdSize=size.dataset.size; reflow(); return; }

  const fg=e.target.closest("[data-fg]");
  if(fg){ finder.gauge=parseFloat(fg.dataset.fg); $("#finder-mount").innerHTML=finderHTML(); return; }
  const fp=e.target.closest("[data-fp]");
  if(fp){ finder.purity=fp.dataset.fp; $("#finder-mount").innerHTML=finderHTML(); return; }

  const add=e.target.closest("[data-add]");
  if(add){
    const code=add.dataset.add, sz=add.dataset.addsize||null;
    const i=rfq.findIndex(x=>x.ag===code && x.size===sz);
    if(i>=0) rfq.splice(i,1); else rfq.push({ag:code,size:sz,qty:50});
    render(); refreshLayer(); return;
  }
  const qty=e.target.closest("[data-qty]");
  if(qty){ const i=+qty.dataset.qty; rfq[i].qty=Math.max(1,(+rfq[i].qty||1)+(+qty.dataset.d)*10); refreshLayer(); $("#rfq-n").textContent=rfq.length; return; }
  const del=e.target.closest("[data-del]");
  if(del){ rfq.splice(+del.dataset.del,1); refreshLayer(); $("#rfq-n").textContent=rfq.length;
    const cl=$("#contact-list"); if(cl) cl.innerHTML=rfqListHTML(false); return; }
  if(e.target.closest("#clear-rfq")){ rfq=[]; refreshLayer(); $("#rfq-n").textContent=0; return; }
});
document.addEventListener("change", e=>{
  const qi=e.target.closest("[data-qtyin]");
  if(qi){ const i=+qi.dataset.qtyin; rfq[i].qty=Math.max(1,parseInt(qi.value,10)||1); refreshLayer(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && layer) closeLayer(); });
document.addEventListener("submit", e=>{
  if(e.target.id!=="rfq-form") return;
  e.preventDefault();

  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const NL = String.fromCharCode(13) + String.fromCharCode(10);
  const co = val("f-co");
  const total = rfq.reduce((a,x)=>a+(+x.qty||0),0);

  const L = [];
  L.push(t("YÊU CẦU BÁO GIÁ","QUOTE REQUEST"));
  L.push("");
  L.push(t("Công ty","Company") + ": " + co);
  L.push(t("Người liên hệ","Contact") + ": " + val("f-name"));
  L.push("Email: " + val("f-mail"));
  L.push(t("Điện thoại / Zalo","Phone / Zalo") + ": " + val("f-tel"));
  L.push(t("Thị trường","Market") + ": " + val("f-country"));
  L.push(t("Tuổi vàng","Purity") + ": " + val("f-purity"));
  L.push(t("Số lượng dự kiến","Intended quantity") + ": " + val("f-qty"));
  L.push("");
  if(rfq.length){
    L.push(t("Mã quan tâm","Codes requested") + " (" + rfq.length + " " + t("mã","codes") + ", " + total + " " + t("sợi","pcs") + "):");
    rfq.forEach(it=>{
      const pr = prod(it.ag);
      L.push("  - " + (it.size || it.ag) + "   " + (pr ? t(pr.vi, pr.en || pr.vi) : "") + "   x" + it.qty);
    });
  } else {
    L.push(t("Chưa chọn mã cụ thể.","No specific codes selected."));
  }
  const note = val("f-note");
  if(note){ L.push(""); L.push(t("Ghi chú","Notes") + ": " + note); }
  L.push("");
  L.push(t("Gửi từ","Sent from") + " " + location.origin);

  const subject = t("Yêu cầu báo giá","Quote request") + (co ? " — " + co : "");
  const body = L.join(NL);
  lastQuoteText = subject + NL + NL + body;
  lastMailto = "";

  const href = "mailto:pkd@asiana-gold.com?subject=" + encodeURIComponent(subject) +
               "&body=" + encodeURIComponent(body);
  lastMailto = href;
  try { window.location.href = href; } catch(err){}

  $("#form-msg").innerHTML = t(
    "Đang mở thư gửi tới pkd@asiana-gold.com. Nếu máy không tự mở, bấm ",
    "Opening a message to pkd@asiana-gold.com. If nothing opens, use ") +
    '<button type="button" id="copy-quote" class="linkish">' +
    t("sao chép nội dung","copy the text") + '</button>' +
    t(" rồi dán vào email.", " and paste it into an email.");
});

/* the composed message, kept so it can be copied if no mail client answers */
let lastQuoteText = "", lastMailto = "";
document.addEventListener("click", e => {
  if(!e.target.closest("#copy-quote")) return;
  const done = ok => {
    const m=$("#form-msg"); if(!m) return;
    if(ok){
      m.textContent = t("Đã sao chép. Dán vào email gửi pkd@asiana-gold.com.",
                        "Copied. Paste it into an email to pkd@asiana-gold.com.");
      return;
    }
    // keep both escape hatches on screen instead of replacing them with a dead end
    m.innerHTML = t("Trình duyệt chặn sao chép tự động. ","The browser blocked the copy. ")
      + '<button type="button" id="copy-quote" class="linkish">' + t("Thử lại","Try again") + '</button>'
      + t(" hoặc ", " or ")
      + '<a class="linkish" href="' + lastMailto + '">' + t("mở thư thủ công","open the message") + '</a>.';
  };
  // the Clipboard API can exist and still be refused (insecure origin, denied
  // permission), so a rejection has to fall through to the older path
  const legacy = () => {
    try{
      const ta=document.createElement("textarea"); ta.value=lastQuoteText;
      ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;top:0;left:-9999px;opacity:0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
      const ok=document.execCommand("copy"); ta.remove(); return ok;
    }catch(err){ return false; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastQuoteText).then(()=>done(true), ()=>done(legacy()));
  } else {
    done(legacy());
  }
});

/* ---------- boot ---------- */
(function boot(){
  const th=store.get("ag-theme",null);
  if(th) document.documentElement.setAttribute("data-theme",th);
  const lg=store.get("ag-lang",null);
  if(lg==="vi"||lg==="en") lang=lg;
  readURL();          // the address wins over the stored preference
  render();
  writeURL(true);     // normalise "/" to "/home"
})();
})();
